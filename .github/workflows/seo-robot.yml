name: Robot SEO

# =============================================================
#  V1.2 — SURVEILLANCE AUTOMATIQUE (dry-run)
#
#  Le robot tourne tout seul toutes les 15 minutes : Camille ajoute
#  une fiche dans le Suivi SEO, le robot la détecte au passage
#  suivant, sans aucune intervention de Martin.
#
#  Tant que robot/config.json porte "dryRun": true, AUCUNE écriture
#  Firebase n'est possible — le robot lit, vérifie et rend compte.
#
#  QUATRE VERROUS, TOUS FERMÉS PAR DÉFAUT
#    dryRun               aucune écriture
#    allowedTestIds       seules les fiches listées sont écrivables
#    autoTermine          le passage en « terminé » reste humain
#    allowScheduledActive le mode actif ne peut PAS venir du cron
#
#  Secrets requis (Settings → Secrets and variables → Actions) :
#    SEO_ROBOT_EMAIL
#    SEO_ROBOT_PASSWORD
#
#  ⚠️ Le dépôt est PUBLIC : les logs de ce workflow sont publics.
#     Le robot n'affiche donc que des résumés anonymisés.
# =============================================================

on:
  # Surveillance automatique, toutes les 15 minutes.
  #
  # ⚠️ Minutes décalées VOLONTAIREMENT. GitHub documente que les
  # déclenchements planifiés sont retardés — voire abandonnés — aux
  # heures chargées, et les minutes rondes (:00 :15 :30 :45) sont de
  # très loin les plus demandées. Un « */15 » n'a produit aucun run
  # en 4 heures, alors que les mêmes créneaux décalés passent.
  #
  # Le cron GitHub reste « best effort » : un retard de quelques
  # minutes est normal et ne signale pas une panne.
  schedule:
    - cron: "7,22,37,52 * * * *"

  # Bouton de secours / debug, et SEUL moyen de lancer un mode actif.
  workflow_dispatch:

permissions:
  contents: read

# Un seul robot à la fois : un passage qui traîne ne doit pas se
# faire doubler par le suivant.
concurrency:
  group: seo-robot
  cancel-in-progress: false

jobs:
  robot:
    name: Détection et vérification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: robot/package-lock.json

      - name: Vérifier la présence des secrets
        env:
          SEO_ROBOT_EMAIL: ${{ secrets.SEO_ROBOT_EMAIL }}
          SEO_ROBOT_PASSWORD: ${{ secrets.SEO_ROBOT_PASSWORD }}
        run: |
          manquants=""
          if [ -z "$SEO_ROBOT_EMAIL" ]; then
            manquants="$manquants SEO_ROBOT_EMAIL"
          fi
          if [ -z "$SEO_ROBOT_PASSWORD" ]; then
            manquants="$manquants SEO_ROBOT_PASSWORD"
          fi
          if [ -n "$manquants" ]; then
            echo "::error::Secret(s) GitHub manquant(s) :$manquants"
            echo "À créer dans Settings → Secrets and variables → Actions."
            echo "Le robot n'a rien exécuté et rien modifié."
            exit 1
          fi
          echo "Secrets présents (valeurs jamais affichées)."

      - name: Installer les dépendances
        working-directory: robot
        run: npm ci --no-audit --no-fund

      - name: Contrôle de sécurité (auto-test hors ligne)
        working-directory: robot
        run: node scripts/selftest.js

      - name: Contrôle pré-vol (garde-fous de sécurité)
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("robot/config.json", "utf8"));
            const dryRun = cfg.dryRun !== false;
            const autoTermine = cfg.autoTermine === true;
            const planifieActifAutorise = cfg.allowScheduledActive === true;
            const ids = Array.isArray(cfg.allowedTestIds) ? cfg.allowedTestIds.filter(Boolean) : [];
            const evenement = process.env.EVENEMENT;
            const err = (m) => { console.log("::error::" + m); process.exit(1); };

            console.log("dryRun ................ " + dryRun);
            console.log("autoTermine ........... " + autoTermine);
            console.log("allowScheduledActive .. " + planifieActifAutorise);
            console.log("liste blanche ......... " + (ids.length ? ids.join(", ") : "(vide)"));
            console.log("déclencheur ........... " + evenement);

            // Verrou 1 : autoTermine doit rester désactivé.
            if (autoTermine) err("autoTermine est à true — exécution refusée. Le passage en « terminé » doit rester humain.");

            if (dryRun) {
              console.log("Mode DRY-RUN : aucune écriture ne sera possible.");
              process.exit(0);
            }

            // --- À partir d’ici, le mode actif est demandé ---

            // Verrou 2 : la liste blanche doit désigner explicitement les fiches autorisées.
            if (ids.length === 0) err("Mode actif demandé mais allowedTestIds est vide — exécution refusée.");

            // Verrou 3 : le mode actif ne peut JAMAIS venir du cron sans
            // un consentement explicite. Le robot tourne toutes les 15 min :
            // un dryRun:false oublié écrirait en base à chaque passage.
            if (evenement === "schedule" && !planifieActifAutorise) {
              err("Mode actif refusé sur un déclenchement planifié : allowScheduledActive vaut false. Aucune écriture na été tentée.");
            }

            // Verrou 4 : tout autre déclencheur est refusé.
            if (evenement !== "workflow_dispatch" && evenement !== "schedule") {
              err("Mode actif interdit sur un déclenchement « " + evenement + " » : lance-le manuellement via Run workflow.");
            }

            console.log("::warning::MODE ACTIF — écritures autorisées sur " + ids.length + " fiche(s) : " + ids.join(", "));
          '

      - name: Lancer le robot
        working-directory: robot
        env:
          SEO_ROBOT_EMAIL: ${{ secrets.SEO_ROBOT_EMAIL }}
          SEO_ROBOT_PASSWORD: ${{ secrets.SEO_ROBOT_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node index.js
